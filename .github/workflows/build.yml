name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Windows, config: Debug,   runner: windows-latest, configure: windows,       build: windows-debug }
          - { os: Windows, config: Release, runner: windows-latest, configure: windows,       build: windows-release }
          - { os: Linux,   config: Debug,   runner: ubuntu-24.04,   configure: linux-debug,   build: linux-debug }
          - { os: Linux,   config: Release, runner: ubuntu-24.04,   configure: linux-release, build: linux-release }

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Ninja, plus the development headers SDL3 needs for its X11,
        # Wayland, audio and input backends.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Work around ASan on Ubuntu 24.04 runners
        if: runner.os == 'Linux' && matrix.config == 'Debug'
        # The runner kernel's high mmap randomization makes ASan crash at
        # startup; this lowers it to a value ASan supports.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.build }}
