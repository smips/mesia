# SPDX-License-Identifier: GPL-3.0-or-later

[project]
name = "mesia-tools"
version = "0.1.0"
description = "Development tools for Mesia: ROM data dumper, input replay recorder, trace and RAM diff against Mesen"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
